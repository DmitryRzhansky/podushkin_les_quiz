<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Два земельных массива площадью 9,5 и 7,4 га в пригороде Хабаровска. Выберите вариант, укажите задачу и договоритесь об осмотре.">
  <title>Земельные участки под Хабаровском — долгосрочная аренда</title>
  <link rel="stylesheet" href="assets/icons/fontawesome.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/translations.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#step-container" data-i18n="skip_link">Go to the quiz</a>
  <main class="experience" id="top">
    <section class="visual-panel" aria-label="Land photos">
      <div class="visual-photo" id="visual-photo-button">
        <img class="visual-image" id="visual-image" src="assets/images/plots-together.webp" alt="" width="1280" height="720" fetchpriority="high">
      </div>
      <div class="visual-shade" aria-hidden="true"></div>
      <div class="visual-copy" aria-live="polite">
        <h1 id="visual-caption" data-i18n="hero_title">Земля для вашего проекта</h1>
        <div class="visual-facts" aria-label="Местоположение и формат аренды">
          <div class="visual-fact">
            <span class="visual-fact-icon" aria-hidden="true"><i class="fa-solid fa-location-dot"></i></span>
            <span class="visual-fact-copy"><strong data-i18n="hero_location_title">Пригород Хабаровска</strong><small data-i18n="hero_location_detail">Аэропорт «Новый» · Тополево</small></span>
          </div>
          <div class="visual-fact">
            <span class="visual-fact-icon" aria-hidden="true"><i class="fa-solid fa-calendar-check"></i></span>
            <span class="visual-fact-copy"><strong data-i18n="hero_offer_title">Долгосрочная аренда</strong><small data-i18n="hero_offer_detail">Участки 9,5 га и 7,4 га</small></span>
          </div>
        </div>
      </div>
    </section>

    <section class="quiz-panel" id="quiz" aria-label="Land selection quiz">
      <div class="panel-controls">
        <span class="panel-step" id="panel-step" aria-live="polite"></span>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" class="language-button is-active" data-language="ru" aria-pressed="true">RU</button>
          <span aria-hidden="true"></span>
          <button type="button" class="language-button" data-language="zh-CN" aria-pressed="false">&#20013;&#25991;</button>
        </div>
      </div>
      <div class="quiz-progress" id="quiz-progress"></div>
      <div class="step-container" id="step-container" aria-live="polite" aria-atomic="false"></div>
    </section>
  </main>
  <dialog class="lead-dialog" id="lead-dialog" aria-label="???????? ???????">
    <section class="lead-dialog-panel" id="lead-dialog-content">
      <button type="button" class="dialog-close" data-action="close-contact" data-i18n-aria="dialog_close" aria-label="Close form"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
      <h2 id="lead-dialog-title" data-i18n="contact_step_title">Leave your contact</h2>
      <form id="lead-form" class="lead-form" novalidate>
        <div class="lead-name-grid">
          <div class="form-field"><label for="lead-surname" data-i18n="form_surname">Surname</label><input id="lead-surname" name="surname" type="text" autocomplete="family-name" data-i18n-placeholder="form_surname_placeholder" required><p class="field-error" id="surname-error" aria-live="polite"></p></div>
          <div class="form-field"><label for="lead-first-name" data-i18n="form_first_name">First name</label><input id="lead-first-name" name="firstName" type="text" autocomplete="given-name" data-i18n-placeholder="form_first_name_placeholder" required><p class="field-error" id="first-name-error" aria-live="polite"></p></div>
        </div>
        <div class="form-field"><label for="lead-phone" data-i18n="form_phone">Phone</label><input id="lead-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 or +86" data-i18n-placeholder="form_contact_phone_placeholder" required><p class="field-error" id="phone-error" aria-live="polite"></p></div>
        <div class="consent-row"><input id="lead-consent" name="consent" type="checkbox"><label for="lead-consent"><span data-i18n="form_consent_before">I agree to the</span> <a id="privacy-link-form" href="#" target="_blank" rel="noopener noreferrer" data-i18n="form_consent_link">privacy policy</a><span data-i18n="form_consent_after">.</span></label></div>
        <p class="field-error" id="consent-error" aria-live="polite"></p>
        <div class="submit-area"><button type="submit" class="nav-next"><span id="submit-label" data-i18n="form_submit">Send request</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button><p class="submit-status" id="submit-status" aria-live="polite" hidden></p></div>
      </form>
    </section>
  </dialog>
  <noscript><p class="noscript-note">JavaScript is required for the quiz. Contact: +7 (924) 203-00-05.</p></noscript>
</body>
